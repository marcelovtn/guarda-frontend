<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Service Unavailable</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background-color: #f8f9fa;
        color: #343a40;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
      }

      h1 {
        color: #495057;
        margin-bottom: 1.5rem;
        font-size: 2.5rem;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .offline-icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
      }

      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #0056b3;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #1a1a1a;
          color: #f8f9fa;
        }

        h1 {
          color: #dee2e6;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="offline-icon">🌐</div>
      <h1>You're Offline</h1>
      <p>
        It seems you've lost your internet connection. Please check your network settings and try
        again.
      </p>
      <button onclick="checkConnection()">Retry Connection</button>
    </div>

    <script>
      function checkConnection() {
        if (navigator.onLine) {
          window.location.reload()
        } else {
          alert('Still offline. Please check your internet connection.')
        }
      }

      setInterval(() => {
        if (navigator.onLine) window.location.reload()
      }, 5000)
    </script>
  </body>
</html>
